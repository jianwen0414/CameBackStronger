# ByteTrack configuration
# Matching metric: bounding-box IoU overlap (NOT centre-distance).
# https://github.com/ultralytics/ultralytics

tracker_type: bytetrack

# ── Confidence thresholds ───────────────────────────────────────────────────
# Detections above track_high_thresh go through the primary IoU pass.
# Detections between track_low_thresh and track_high_thresh are used in the
# secondary pass to recover briefly-lost tracks (helps with occluded knives).
track_high_thresh:          0.25
track_low_thresh:           0.10
track_activation_threshold: 0.25
new_track_thresh:           0.25

# ── IoU matching ────────────────────────────────────────────────────────────
# match_thresh: minimum IoU overlap to link a detection to an existing track.
# 0.5 is low enough for small, fast-moving weapons without causing false links.
match_thresh: 0.8

# fuse_score: when True, multiplies IoU by detection confidence before
# matching. Disabled here so matching is based purely on spatial overlap.
fuse_score: False

# ── Track lifecycle ─────────────────────────────────────────────────────────
# min_hits: consecutive frames before a track is confirmed.
# 1 = knives register immediately; false positives are handled upstream
# by the ownership state machine (confirm_frames=5 before any alert fires).
min_hits:     1

# track_buffer: frames a lost track is kept before deletion.
# Larger values help re-link weapons after brief occlusion.
track_buffer: 100

# Camera motion compensation — set True only for PTZ / moving cameras.
with_reid: False
